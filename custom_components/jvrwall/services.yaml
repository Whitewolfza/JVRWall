set_meal:
  fields:
    day: {required: true, example: monday, selector: {select: {options: [monday, tuesday, wednesday, thursday, friday, saturday, sunday]}}}
    meal: {required: true, example: Lasagna, selector: {text: null}}
    slot: {default: dinner, selector: {select: {options: [breakfast, lunch, dinner]}}}
